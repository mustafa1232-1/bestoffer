name: android-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'release-*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app_user
            working_directory: apps/app_user
            target: ""
            app_id: ""
            app_label: ""
          - app: app_store
            working_directory: .
            target: lib/main_store.dart
            app_id: com.maslaki.store
            app_label: Maslaki Store
          - app: app_delivery
            working_directory: apps/app_delivery
            target: ""
            app_id: ""
            app_label: ""
          - app: app_taxi_captain
            working_directory: apps/app_taxi_captain
            target: ""
            app_id: ""
            app_label: ""
          - app: app_company
            working_directory: apps/app_company
            target: ""
            app_id: ""
            app_label: ""
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'

      - name: Decode release keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/maslaki-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/maslaki-upload.jks" >> "$GITHUB_ENV"

      - name: ${{ matrix.app }} pub get
        run: flutter pub get
        working-directory: ${{ matrix.working_directory }}

      - name: ${{ matrix.app }} debug apk
        env:
          ORG_GRADLE_PROJECT_APP_ID: ${{ matrix.app_id }}
          ORG_GRADLE_PROJECT_APP_LABEL: ${{ matrix.app_label }}
        run: |
          args=(build apk --debug)
          if [ -n "${{ matrix.target }}" ]; then
            args+=(-t "${{ matrix.target }}")
          fi
          flutter "${args[@]}"
        working-directory: ${{ matrix.working_directory }}

      - name: ${{ matrix.app }} release appbundle
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          ORG_GRADLE_PROJECT_APP_ID: ${{ matrix.app_id }}
          ORG_GRADLE_PROJECT_APP_LABEL: ${{ matrix.app_label }}
        run: |
          args=(build appbundle --release)
          if [ -n "${{ matrix.target }}" ]; then
            args+=(-t "${{ matrix.target }}")
          fi
          flutter "${args[@]}"
        working-directory: ${{ matrix.working_directory }}

      - name: Release signing not configured
        if: ${{ !(secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '') }}
        run: echo "Release bundle skipped for ${{ matrix.app }} because signing secrets are missing."
