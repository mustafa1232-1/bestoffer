name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  patch-taxi-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-taxi-map-tiles
      - name: Replace CARTO taxi tiles with OpenStreetMap
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('lib/pages/map_page.dart'); s=p.read_text(); old='https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'; new='https://tile.openstreetmap.org/{z}/{x}/{y}.png'; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old,new,1))"
          ! grep -F "basemaps.cartocdn.com/dark_all" lib/pages/map_page.dart
          grep -F "https://tile.openstreetmap.org/{z}/{x}/{y}.png" lib/pages/map_page.dart
      - name: Commit patched map
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/map_page.dart
          git commit -m "fix(user): replace keyed taxi map tiles"
          git push origin HEAD:fix/user-taxi-map-tiles

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Backend tests
        run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test
        run: flutter test
      - name: Flutter build web
        run: flutter build web --release
