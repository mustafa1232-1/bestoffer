name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  cleanup-map-lint:
    if: github.ref == 'refs/heads/fix/user-taxi-map-tiles' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-taxi-map-tiles
          fetch-depth: 0
      - name: Fix map analyzer lint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/pages/map_page.dart')
          s = p.read_text(encoding='utf-8')
          old = 'tileBuilder: (_, tileWidget, __) => ColorFiltered('
          new = 'tileBuilder: (_, tileWidget, _) => ColorFiltered('
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F "tileBuilder: (_, tileWidget, _) => ColorFiltered(" lib/pages/map_page.dart
      - name: Commit cleaned map and restore CI
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin maslaki-final-v
          git checkout origin/maslaki-final-v -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml lib/pages/map_page.dart
          git commit -m "fix(user): clean taxi map analyzer lint"
          git push origin HEAD:fix/user-taxi-map-tiles

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Backend tests
        run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test
        run: flutter test
      - name: Flutter build web
        run: flutter build web --release
