name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  patch-dark-taxi-map:
    if: github.ref == 'refs/heads/fix/user-taxi-map-tiles' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-taxi-map-tiles
          fetch-depth: 0
      - name: Apply Maslaki dark map theme
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('lib/pages/map_page.dart'); s=p.read_text(); old='              initialZoom: _initialZoom,\\n              onTap: (_, point) => _onMapTap(point),'; new='              initialZoom: _initialZoom,\\n              backgroundColor: const Color(0xFF111A28),\\n              onTap: (_, point) => _onMapTap(point),'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          python3 -c "from pathlib import Path; p=Path('lib/pages/map_page.dart'); s=p.read_text(); old=\"                ),\\n              ),\\n              const RichAttributionWidget(\"; new=\"                ),\\n                // Maslaki navy night rendering; OSM coverage remains global.\\n                tileBuilder: (_, tileWidget, __) => ColorFiltered(\\n                  colorFilter: const ColorFilter.matrix(<double>[\\n                    -0.197, -0.257, -0.026, 0, 139.79,\\n                    -0.089, -0.436, -0.030, 0, 164.37,\\n                    -0.103, -0.347, -0.196, 0, 194.10,\\n                    0, 0, 0, 1, 0,\\n                  ]),\\n                  child: tileWidget,\\n                ),\\n              ),\\n              const RichAttributionWidget(\"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          python3 -c "from pathlib import Path; p=Path('test/pages/taxi_map_tile_source_test.dart'); s=p.read_text(); old=\"    expect(source, contains('© OpenStreetMap contributors'));\\n\"; new=\"    expect(source, contains('© OpenStreetMap contributors'));\\n    expect(source, contains('backgroundColor: const Color(0xFF111A28)'));\\n    expect(source, contains('tileBuilder:'));\\n    expect(source, contains('ColorFilter.matrix'));\\n\"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          grep -F "backgroundColor: const Color(0xFF111A28)" lib/pages/map_page.dart
          grep -F "ColorFilter.matrix" lib/pages/map_page.dart
          grep -F "tile.openstreetmap.org" lib/pages/map_page.dart
          ! grep -F "basemaps.cartocdn.com" lib/pages/map_page.dart
      - name: Commit final map and restore workflows
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin maslaki-final-v
          git checkout origin/maslaki-final-v -- .github/workflows/ci.yml
          git rm -f .github/workflows/tmp-dark-taxi-map.yml
          git add .github/workflows/ci.yml lib/pages/map_page.dart test/pages/taxi_map_tile_source_test.dart
          git commit -m "feat(user): add Maslaki dark taxi map theme"
          git push origin HEAD:fix/user-taxi-map-tiles

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Backend tests
        run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test
        run: flutter test
      - name: Flutter build web
        run: flutter build web --release
