name: mobile-hard-split-gates

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  root-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
      - name: Root pub get
        run: flutter pub get
      - name: Root analyze
        run: flutter analyze
      - name: Root test
        run: flutter test

  split-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app_user
            working_directory: apps/app_user
            target: ""
          - app: app_store
            working_directory: .
            target: lib/main_store.dart
          - app: app_delivery
            working_directory: apps/app_delivery
            target: ""
          - app: app_taxi_captain
            working_directory: apps/app_taxi_captain
            target: ""
          - app: app_company
            working_directory: apps/app_company
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
      - name: ${{ matrix.app }} pub get
        run: flutter pub get
        working-directory: ${{ matrix.working_directory }}
      - name: ${{ matrix.app }} analyze
        run: flutter analyze
        working-directory: ${{ matrix.working_directory }}
      - name: ${{ matrix.app }} test
        run: flutter test
        working-directory: ${{ matrix.working_directory }}

  split-governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
      - name: Import boundary guard
        shell: pwsh
        run: ./scripts/check_import_boundaries.ps1
      - name: Localization terms guard
        shell: pwsh
        run: ./scripts/check_localization_terms.ps1
