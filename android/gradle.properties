# Force an English/UTF-8 locale for the Gradle JVM so bundletool's DexFilesValidator
# parses/sorts the dex file indices (classes.dex, classes2.dex, ...) in a stable,
# locale-independent way. A non-English JVM locale is the documented trigger for
# "Invalid dex file indices, expecting 'classes?.dex' but found 'classes2.dex'"
# during packageReleaseBundle (bundletool google/bundletool#344).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx1024m -Duser.language=en -Duser.country=US -Duser.variant= -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
android.useAndroidX=true

# R8 full mode aggressively merges/optimizes classes and can break Pigeon-based
# plugin channels (e.g. path_provider) at runtime even with matching -keep
# rules in proguard-rules.pro. Compat mode avoids this class of breakage.
android.enableR8.fullMode=false

# Reduce Kotlin daemon connection issues on Windows/Flutter builds.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.enabled=false
