# Force an English/UTF-8 locale for the Gradle JVM so bundletool's DexFilesValidator
# parses/sorts the dex file indices (classes.dex, classes2.dex, ...) in a stable,
# locale-independent way. A non-English JVM locale is the documented trigger for
# "Invalid dex file indices, expecting 'classes?.dex' but found 'classes2.dex'"
# during packageReleaseBundle (bundletool google/bundletool#344).
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=3G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx1024m -Duser.language=en -Duser.country=US -Duser.variant= -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
android.useAndroidX=true

# R8 runs in full mode (the AGP default) with optimized resource shrinking.
# Plugin entry points, Pigeon channels and JNI/reflection
# targets are pinned in app/proguard-rules.pro; do not opt back into compat mode.
android.r8.optimizedResourceShrinking=true

# Reduce Kotlin daemon connection issues on Windows/Flutter builds.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.enabled=false
# Kotlin 2.3 compiles through the Build Tools API by default, which ignores the
# in-process strategy above and fails on Windows with "Could not connect to
# Kotlin compile daemon" / "Could not close incremental caches".
kotlin.compiler.runViaBuildToolsApi=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
