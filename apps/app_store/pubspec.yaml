name: maslaki_store
description: "Maslaki Store application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  app_store_runtime:
    path: ../../packages/app_store_runtime

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^2.5.1
  core_auth:
    path: ../../packages/core_auth
  core_storage:
    path: ../../packages/core_storage

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  image_path: assets/branding/maslaki_official_logo.png
  adaptive_icon_background: "#F5EEE4"
  adaptive_icon_foreground: assets/branding/maslaki_official_logo.png
  remove_alpha_ios: true

dependency_overrides:
  firebase_core:
    path: ../../third_party/firebase_core
  firebase_messaging_platform_interface: 4.6.10
