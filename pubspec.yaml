name: maslaki
description: "Maslaki - Basmaya super-app for shopping, food, and taxi"
publish_to: 'none'
version: 1.0.1+9
environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.4.3

  # Auth token storage
  flutter_secure_storage: ^9.2.2

  # State management
  flutter_riverpod: ^2.5.1

  # Decode JWT (to know admin/user quickly)
  jwt_decoder: ^2.0.1

  # Routing
  go_router: ^14.2.1

  # Optional UI helpers (nice to have)
  google_fonts: ^6.2.1
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  # Pinned to force the modern Android system Photo Picker (gallery) instead of
  # the legacy ACTION_GET_CONTENT documents chooser. See media_picker_service.
  image_picker_android: ^0.8.13+14
  image_picker_platform_interface: ^2.11.1
  shared_preferences: ^2.3.2
  camera: ^0.11.2+1
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  esc_pos_utils_plus: ^2.0.4
  esc_pos_printer_plus: ^0.1.0
  excel: ^4.0.6
  share_plus: ^11.1.0
  flutter_local_notifications: ^17.2.4
  firebase_core: ^3.15.2
  firebase_messaging: ^15.1.6
  simple_icons: ^14.6.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.1.0
  url_launcher: ^6.3.0
  flutter_webrtc: ^0.14.2
  video_player: ^2.9.5
  audioplayers: ^6.1.0
  record: ^6.1.1
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  google_mlkit_face_detection: ^0.13.1
  ffmpeg_kit_flutter_new: ^4.2.1
  device_info_plus: ^11.2.0
  android_intent_plus: ^5.3.1
  package_info_plus: ^8.0.2
  lottie: ^3.3.0
  sentry_flutter: ^9.0.0
  supabase_flutter: ^2.3.2
  image: ^4.3.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  crypto: ^3.0.6
  asn1lib: ^1.6.5
  path: ^1.9.1
  core_design_system:
    path: packages/core_design_system
  core_maps:
    path: packages/core_maps
  app_company_runtime:
    path: packages/app_company_runtime
  social_core:
    path: packages/social_core
  social_ui:
    path: packages/social_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  app_user_runtime:
    path: packages/app_user_runtime
  core_auth:
    path: packages/core_auth
  core_storage:
    path: packages/core_storage
  geolocator_platform_interface: ^4.2.6

dependency_overrides:
  firebase_core:
    path: third_party/firebase_core
  jni:
    path: third_party/jni

flutter:
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    - assets/audio/attention_alert.wav
    - assets/brand/
    - assets/branding/
    - assets/fonts/
    - assets/lottie/
  fonts:
    # Bundled complete Arabic font (Tajawal). Used as the guaranteed fallback so
    # every Arabic glyph (e.g. "ف") renders even when the runtime google_fonts
    # download is unavailable. The old NotoNaskhArabic ttf files were corrupted.
    - family: TajawalLocal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/branding/maslaki_official_logo.png
    background_color: "#F5EEE4"
    theme_color: "#F5EEE4"
  windows:
    generate: true
    image_path: assets/branding/maslaki_official_logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/maslaki_official_logo.png
  image_path: assets/branding/maslaki_official_logo.png
  adaptive_icon_background: "#F5EEE4"
  adaptive_icon_foreground: assets/branding/maslaki_official_logo.png
  remove_alpha_ios: true
